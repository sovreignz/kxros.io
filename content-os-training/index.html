<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0c0d">
  <meta name="description" content="Design a content machine that creates, distributes, and learns—without consuming the founder's life.">
  <meta property="og:title" content="Content OS — Live Training">
  <meta property="og:description" content="Better content. More consistently. Less founder friction.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://kxros.io/content-os-training/">
  <meta name="twitter:card" content="summary">
  <title>Content OS — Live Training</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <button class="wordmark" data-overview-open aria-label="Open session overview">CONTENT OS</button>
    <div class="act-label" aria-live="polite"></div>
    <button class="overview-button" data-overview-open>OVERVIEW <span>O</span></button>
  </header>
  <main id="deck" class="deck" aria-live="polite"></main>
  <footer class="bottombar">
    <div class="progress"><i></i></div><div class="slide-mode"></div>
    <div class="slide-count"><b>01</b><span>/ 34</span></div>
    <div class="key-hints"><span>← → NAVIGATE</span><span>SPACE REVEAL</span><span>P NOTES</span></div>
  </footer>
  <button class="nav-edge nav-prev" aria-label="Previous slide"></button><button class="nav-edge nav-next" aria-label="Next slide"></button>
  <aside class="presenter" aria-hidden="true">
    <button class="panel-close" data-presenter-close aria-label="Close presenter notes">×</button>
    <div class="presenter-title"><span>PRESENTER NOTES</span><b></b></div>
    <div class="note"><strong>OBJECTIVE</strong><p data-note="objective"></p></div>
    <div class="note"><strong>ASK</strong><p data-note="ask"></p></div>
    <div class="note"><strong>LISTEN FOR</strong><p data-note="listen"></p></div>
    <div class="note"><strong>CAPTURE</strong><p data-note="capture"></p></div>
  </aside>
  <aside class="overview" aria-hidden="true">
    <div class="overview-header"><div><span>CONTENT OS / LIVE TRAINING</span><h2>Eight-act session</h2></div><button class="panel-close" data-overview-close aria-label="Close overview">×</button></div>
    <nav class="act-nav" aria-label="Jump to act"></nav>
    <p class="overview-help">Choose an act to jump · O overview · P presenter notes · Esc close</p>
  </aside>
  <script src="app.js"></script>
</body>
</html>
